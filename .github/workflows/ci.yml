name: CI

# 本机（Windows + Smart App Control/WDAC）会拦掉所有新编译的二进制，
# 所以完整验证放在 CI 上跑：
#   linux   —— 规则、协议、真 TCP 联调、stdio 子进程
#   windows —— GDExtension + Godot headless，跑客户端层那三项 transport 自检
#
# 公共仓库的 Actions 分钟数免费。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / 规则 + 协议 + TCP 联调
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ python3

      - name: 构建
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: C++ 端到端自检（26 项）
        run: ./build/md_selftest

      - name: 200 局平衡基线
        run: ./build/md_sim 200 1 8 7 9 | tee baseline.txt

      - name: stdio 服务器冒烟
        run: |
          out=$(printf '{"t":"join"}\n{"t":"start"}\n' | ./build/md_stdio --seed 5 --rounds 8)
          echo "$out" | head -5
          echo "$out" | grep -q '"t":"ready"' || { echo "缺少 ready"; exit 1; }
          echo "$out" | grep -q '"t":"sync"' || { echo "缺少 sync"; exit 1; }

      - name: TCP 集成测试（真 socket、真进程）
        run: python3 tools/tcp_client_test.py ./build/md_server

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-baseline
          path: baseline.txt
          if-no-files-found: ignore

  windows:
    name: Windows / GDExtension + Godot
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # gh 的 API 调用要鉴权，否则一样会撞限流
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: 拉取 godot-cpp
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/fetch-godot-cpp.ps1

      - name: 构建（含 GDExtension）
        shell: pwsh
        run: |
          cmake -S . -B build-gdext -A x64 `
                -DGODOTCPP_TARGET=template_release -DMD_BUILD_GDEXTENSION=ON
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build-gdext --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem godot/addons/md_core/bin

      - name: Godot 下载 + 导入 + 客户端自检（单步完成，避免跨步传变量）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            Write-Host "::warning::进入 Godot 环节，先看看构建产物"
            Get-ChildItem godot/addons/md_core/bin -ErrorAction SilentlyContinue | Select-Object Name, Length
            Get-ChildItem build-gdext/Release -Filter *.exe -ErrorAction SilentlyContinue | Select-Object Name

            # --- 下载 ---
            # 不要用未鉴权的 REST API：共享 runner IP 很容易撞上 60 次/小时的限流
            # （上一个 run 就是这么挂的：403 rate limit exceeded）。
            # 优先用 gh（Runner 上自带，且带鉴权），失败再退回固定下载 URL。
            New-Item -ItemType Directory -Force -Path godot-dl | Out-Null
            $tag = $null
            $listing = gh release list --repo godotengine/godot --limit 80 --json tagName --jq ".[].tagName" 2>$null
            if ($LASTEXITCODE -eq 0 -and $listing) {
              $tag = $listing | Where-Object { $_ -match '^4\.7\.\d+-stable$' } | Select-Object -First 1
              if (-not $tag) {
                $tag = $listing | Where-Object { $_ -match '^4\.\d+\.\d+-stable$' } | Select-Object -First 1
              }
            }
            if ($tag) {
              Write-Host "gh 选中: $tag"
              gh release download $tag --repo godotengine/godot --pattern "*win64.exe.zip" --dir godot-dl --clobber
            }
            if (-not (Get-ChildItem godot-dl -Filter *.zip -ErrorAction SilentlyContinue)) {
              Write-Host "gh 没取到，改用固定 URL"
              foreach ($cand in @("4.7.2-stable", "4.7.1-stable", "4.7-stable")) {
                $url = "https://github.com/godotengine/godot/releases/download/" + $cand + "/Godot_v" + $cand + "_win64.exe.zip"
                try {
                  Write-Host "尝试 $url"
                  Invoke-WebRequest -Uri $url -OutFile "godot-dl/godot.zip"
                  break
                } catch {
                  Write-Host "  失败: $($_.Exception.Message)"
                }
              }
            }
            $zip = Get-ChildItem godot-dl -Filter *.zip | Select-Object -First 1
            if (-not $zip) { throw "没下载到 Godot 压缩包" }
            Write-Host "压缩包: $($zip.FullName) ($($zip.Length) bytes)"
            Expand-Archive $zip.FullName -DestinationPath godot-bin -Force
            $exe = (Get-ChildItem godot-bin -Filter *.exe -Recurse | Select-Object -First 1).FullName
            if (-not $exe) { throw "解压后找不到 exe" }
            Write-Host "引擎: $exe"

            # --- 导入 ---
            $proj = Join-Path $env:GITHUB_WORKSPACE "godot"
            Write-Host "工程: $proj"
            $out = & $exe --headless --path $proj --import 2>&1
            $code = $LASTEXITCODE
            $out | Select-Object -Last 25
            Write-Host "import exit code: $code"
            Write-Host "--- .godot 目录 ---"
            Get-ChildItem (Join-Path $proj ".godot") -ErrorAction SilentlyContinue | Select-Object Name

            # --- 自检 ---
            $stdio = "build-gdext/Release/md_stdio.exe"
            if (Test-Path $stdio) { $env:MD_STDIO_EXE = (Resolve-Path $stdio).Path }
            Write-Host "MD_STDIO_EXE=$env:MD_STDIO_EXE"
            $out2 = & $exe --headless --path $proj 2>&1
            $rc = $LASTEXITCODE
            $out2 | Select-Object -Last 45
            Write-Host "selftest exit: $rc"
            if ($rc -ne 0) { throw "客户端自检失败，exit=$rc" }

            # exit 0 不等于 transport 真跑了：skip 不计入失败。
            # 这里断言 skip=0，否则这一轮等于什么都没验。
            $line = $out2 | Where-Object { $_ -match "RESULT pass=" } | Select-Object -Last 1
            Write-Host "结果行: $line"
            if (-not $line) { throw "自检没有输出 RESULT 行" }
            if ($line -notmatch "skip=0") {
              throw "有 transport 被跳过，说明没真跑: $line"
            }
          }
          catch {
            $msg = "$($_.Exception.GetType().Name): $($_.Exception.Message)"
            $msg = $msg -replace "[\r\n]+", " "
            if ($msg.Length -gt 350) { $msg = $msg.Substring(0, 350) }
            Write-Host "::error::$msg"
            exit 1
          }
